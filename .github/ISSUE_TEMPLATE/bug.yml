name: Bug report
description: Report a reproducible defect using synthetic metadata only.
body:
  - type: markdown
    attributes:
      value: Never include credentials, tokens, private metadata, or personal data.
  - type: input
    id: version
    attributes: {label: Version, placeholder: v0.1.0}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction, description: Include a minimized synthetic fixture and exact command.}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
